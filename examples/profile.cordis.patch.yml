# profile 配置示例（$DSH_HOME/profiles/<profile>/cordis.patch.yml）。
# 首次启动前替换 <placeholders>；参见 docs/006-deployment.md。
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# 飞书是可选的：取消注释以启用其来源，然后在飞书来源上设置机器人的 lark-cli。
# - id: dsh-superagent-feishu
#   disabled: false
# GitLab 是可选的：取消注释以启用其来源，然后在 GitLab 来源上设置项目和 glab CLI。
# - id: dsh-superagent-gitlab
#   disabled: false
