# profile 配置示例（$DSH_HOME/profiles/<profile>/cordis.patch.yml）。
# 首次启动前替换 <placeholders>；参见 docs/006-deployment.md。
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# 来源（GitHub / GitLab / 飞书）是记录，不是插件条目：适配器随主插件加载，
# 在管理面板的「来源 → 新增来源」里创建、启停和删除。
